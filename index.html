<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Rock Paper Scissors</title>
    <meta name="description" content="Play Rock Paper Scissors against the computer.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: linear-gradient(to right top, #a1c4fd, #c2e9fb); 
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; 
        padding: 20px; 
      }

      .container {
        background: #ffffff;
        border-radius: 20px; 
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
        text-align: center;
        max-width: 450px; 
        width: 100%; 
      }

      h1 {
        font-size: 2.2rem; 
        color: #333;
        margin-bottom: 30px; 
        font-weight: 700; 
      }

      
      .buttons {
        display: flex;
        justify-content: center; 
        gap: 15px; 
        margin: 30px 0; 
        flex-wrap: wrap; 
      }

      
      button {
        background-color: #4f46e5; 
        color: white;
        border: none;
        padding: 14px 24px; 
        font-size: 1.1rem; 
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease; 
        font-weight: 600; 
        flex-grow: 1; 
        max-width: 120px; 
      }

      button:hover {
        background-color: #3730a3; 
        transform: translateY(-2px); 
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); 
      }

      button:active {
        transform: translateY(0); 
        box-shadow: none;
      }

      #reset {
        background-color: #f43f5e; 
        margin-top: 10px; 
        flex-basis: 100%; 
        max-width: 150px;
      }

      #reset:hover {
        background-color: #be123c; 
      }

      #result {
        white-space: pre-line; 
        margin-top: 30px;
        font-size: 1.2rem;
        color: #1f2937;
        min-height: 80px; 
        display: flex; 
        align-items: center;
        justify-content: center;
        line-height: 1.6; 
      }

      
      button:focus {
          outline: 3px solid #6366f1;
          outline-offset: 2px;
      }

    </style>

  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <div class="buttons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
      </div>
      <button id="reset">Reset Game</button> <div id="result"></div>
    </div>

    <script src="app.js" async defer></script>
  </body>
</html>
